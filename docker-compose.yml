services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: foodlens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodlens}
      POSTGRES_USER: ${POSTGRES_USER:-foodlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodlens_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foodlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodlens} -d ${POSTGRES_DB:-foodlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodlens-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - foodlens-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foodlens-postgres-data:
  foodlens-redis-data:
